<title>전략 그래프 러너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#FFFFFF; --ink:#141414; --line:#141414; --muted:#6E6B63;
    --passed:#E9E7DF; --ok:#0B7A3B; --panel:#FCFBF8;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  body{background:var(--paper); color:var(--ink); font-family:var(--sans);
    margin:0; padding-block:28px 48px; padding-inline:clamp(16px,4vw,48px);}
  .wrap{max-width:1080px; margin:0 auto;}
  .eyebrow{font:500 11px/1 var(--mono); letter-spacing:.14em; color:var(--muted); text-transform:uppercase;}
  h1{font-size:clamp(22px,3.4vw,30px); font-weight:700; margin:6px 0 2px; letter-spacing:-.01em; text-wrap:balance;}
  .sub{color:var(--muted); font-size:14px; margin:0 0 20px;}
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .tab{font:500 13px/1 var(--sans); padding:9px 14px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink); cursor:pointer; border-radius:2px;}
  .tab[aria-selected="true"]{background:var(--ink); color:#fff;}
  .tab:focus-visible,.run:focus-visible{outline:2px solid var(--ok); outline-offset:2px;}
  .stage{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:16px; align-items:stretch;}
  @media (max-width:820px){.stage{grid-template-columns:1fr;}}
  .panel{border:1.5px solid var(--line); background:var(--panel); border-radius:2px; min-width:0;}
  .panel-h{display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:10px 14px; border-bottom:1.5px solid var(--line);}
  .panel-h b{font-size:13px; font-weight:700;}
  .panel-h span{font:400 11px/1.4 var(--mono); color:var(--muted);}
  .graph{padding:10px 8px 4px;}
  .graph svg{display:block; width:100%; height:auto;}
  .legend{display:flex; gap:16px; flex-wrap:wrap; padding:8px 14px 12px;
    font:400 11px/1 var(--mono); color:var(--muted);}
  .legend i{display:inline-block; width:10px; height:10px; margin-right:5px; vertical-align:-1px; border:1.5px solid var(--line);}
  .legend .l-act i{background:var(--ink);} .legend .l-done i{background:var(--passed);}
  /* graph pieces */
  .node rect{fill:var(--paper); stroke:var(--line); stroke-width:1.5;}
  .node text{fill:var(--ink); font:500 12px var(--mono);}
  .node.done rect{fill:var(--passed);}
  .node.act rect{fill:var(--ink);} .node.act text{fill:#fff;}
  .edge{stroke:#B9B5AA; stroke-width:1.5; fill:none;}
  .edge.taken{stroke:var(--ink); stroke-width:2.5;}
  .elabel{font:400 10.5px var(--mono); fill:var(--muted);}
  .elabel.taken{fill:var(--ink); font-weight:500;}
  marker path{fill:#B9B5AA;} .taken-marker path{fill:var(--ink);}
  /* console */
  .console{display:flex; flex-direction:column; min-height:100%;}
  .prompt{display:flex; gap:8px; align-items:center; padding:12px 14px; border-bottom:1.5px solid var(--line);}
  .prompt .chev{font:700 15px var(--mono); color:var(--ok);}
  .prompt .q{flex:1; font:400 13.5px var(--mono); color:var(--ink); overflow-wrap:anywhere;}
  .run{font:700 13px var(--sans); background:var(--ink); color:#fff; border:1.5px solid var(--ink);
    padding:9px 16px; cursor:pointer; border-radius:2px;}
  .run[disabled]{opacity:.45; cursor:default;}
  .out{flex:1; margin:0; padding:12px 14px 16px; font:400 12.5px/1.85 var(--mono);
    list-style:none; overflow-x:auto;}
  .out li{white-space:pre-wrap;}
  .out .sys{color:var(--muted);}
  .out .llm{color:var(--ink);}
  .out .tool{color:var(--ink); font-weight:500;}
  .out .ok{color:var(--ok); font-weight:500;}
  .foot{margin-top:18px; font-size:12.5px; color:var(--muted); max-width:66ch;}
  .foot code{font:400 11.5px var(--mono); background:var(--passed); padding:1px 5px; border-radius:2px;}
  @media (prefers-reduced-motion:reduce){.node,.edge{transition:none;}}
</style>

<div class="wrap">
  <p class="eyebrow">phase3 · 발표 데모 목업</p>
  <h1>전략 그래프 러너</h1>
  <p class="sub">Koog 전략 그래프를 실행하면서, 에이전트가 지나가는 노드와 엣지를 실시간으로 켠다</p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-route" aria-selected="true">라우팅 — 조건 엣지</button>
    <button class="tab" role="tab" id="tab-tool" aria-selected="false">도구 루프 — 그래프 왕복</button>
    <button class="tab" role="tab" id="tab-mcp" aria-selected="false">MCP — phase2 서버 접속</button>
  </div>

  <div class="stage">
    <section class="panel">
      <div class="panel-h"><b>전략 그래프</b><span id="strategy-name">strategy("route")</span></div>
      <div class="graph">

        <svg id="svg-route" viewBox="0 0 600 232" aria-label="라우팅 전략 그래프">
          <defs>
            <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker>
            <marker id="arT" class="taken-marker" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker>
          </defs>
          <path id="r-e1" class="edge" d="M84,116 L136,116" marker-end="url(#ar)"/>
          <path id="r-e2" class="edge" d="M258,102 C300,80 320,72 356,64" marker-end="url(#ar)"/>
          <text id="r-l2" class="elabel" x="286" y="66">"MATH" in text</text>
          <path id="r-e3" class="edge" d="M258,130 C300,152 320,160 356,168" marker-end="url(#ar)"/>
          <text id="r-l3" class="elabel" x="296" y="182">else</text>
          <path id="r-e4" class="edge" d="M472,64 C508,72 520,92 530,104" marker-end="url(#ar)"/>
          <path id="r-e5" class="edge" d="M472,168 C508,160 520,140 530,128" marker-end="url(#ar)"/>
          <g id="r-start" class="node"><rect x="16" y="96" width="68" height="40" rx="3"/><text x="50" y="120" text-anchor="middle">start</text></g>
          <g id="r-classify" class="node"><rect x="136" y="96" width="122" height="40" rx="3"/><text x="197" y="120" text-anchor="middle">classify</text></g>
          <g id="r-math" class="node"><rect x="356" y="44" width="116" height="40" rx="3"/><text x="414" y="68" text-anchor="middle">math</text></g>
          <g id="r-other" class="node"><rect x="356" y="148" width="116" height="40" rx="3"/><text x="414" y="172" text-anchor="middle">other</text></g>
          <g id="r-finish" class="node"><rect x="524" y="96" width="64" height="40" rx="3"/><text x="556" y="120" text-anchor="middle">finish</text></g>
        </svg>

        <svg id="svg-tool" viewBox="0 0 600 232" aria-label="도구 루프 전략 그래프" hidden>
          <path id="t-e1" class="edge" d="M84,116 L124,116" marker-end="url(#ar)"/>
          <path id="t-e2" class="edge" d="M252,100 C284,80 300,70 330,60" marker-end="url(#ar)"/>
          <text id="t-l2" class="elabel" x="256" y="62">onToolCalls</text>
          <path id="t-e3" class="edge" d="M394,84 L394,140" marker-end="url(#ar)"/>
          <path id="t-e4" class="edge" d="M460,166 C500,158 516,140 528,126" marker-end="url(#ar)"/>
          <text id="t-l4" class="elabel" x="452" y="196">onTextMessage</text>
          <path id="t-e5" class="edge" d="M252,132 C330,168 420,140 524,118" marker-end="url(#ar)"/>
          <g id="t-start" class="node"><rect x="16" y="96" width="68" height="40" rx="3"/><text x="50" y="120" text-anchor="middle">start</text></g>
          <g id="t-request" class="node"><rect x="124" y="96" width="128" height="40" rx="3"/><text x="188" y="120" text-anchor="middle">request</text></g>
          <g id="t-execute" class="node"><rect x="330" y="40" width="128" height="40" rx="3"/><text x="394" y="64" text-anchor="middle">executeTools</text></g>
          <g id="t-report" class="node"><rect x="330" y="144" width="130" height="40" rx="3"/><text x="395" y="168" text-anchor="middle">sendResults</text></g>
          <g id="t-finish" class="node"><rect x="524" y="96" width="64" height="40" rx="3"/><text x="556" y="120" text-anchor="middle">finish</text></g>
        </svg>

        <svg id="svg-mcp" viewBox="0 0 600 232" aria-label="MCP 접속 구성도" hidden>
          <path id="m-e1" class="edge" d="M232,90 L364,90" marker-end="url(#ar)"/>
          <text id="m-l1" class="elabel" x="242" y="78">tools/list · tools/call</text>
          <path id="m-e2" class="edge" d="M364,148 L232,148" marker-end="url(#ar)"/>
          <text id="m-l2" class="elabel" x="250" y="170">주문 조회 결과</text>
          <g id="m-agent" class="node"><rect x="24" y="66" width="208" height="104" rx="3"/>
            <text x="128" y="108" text-anchor="middle">Koog 에이전트</text>
            <text x="128" y="130" text-anchor="middle" style="font-size:10.5px; fill:var(--muted)">demo-phase3</text></g>
          <g id="m-server" class="node"><rect x="364" y="66" width="212" height="104" rx="3"/>
            <text x="470" y="108" text-anchor="middle">MCP 서버</text>
            <text x="470" y="130" text-anchor="middle" style="font-size:10.5px; fill:var(--muted)">demo-phase2 · :8080/mcp</text></g>
        </svg>

      </div>
      <div class="legend">
        <span class="l-act"><i></i>실행 중</span>
        <span class="l-done"><i></i>지나감</span>
        <span><i style="background:none"></i>굵은 선 = 택한 엣지</span>
      </div>
    </section>

    <section class="panel console">
      <div class="prompt">
        <span class="chev">❯</span>
        <span class="q" id="q-text">2 더하기 3은?</span>
        <button class="run" id="run-btn">실행</button>
      </div>
      <ul class="out" id="out"></ul>
    </section>
  </div>

  <p class="foot">발표용 화면 목업입니다. 콘솔 출력은 <code>demo-phase3</code> 테스트의 실측 캡처이고,
  실제 구현에서는 Koog의 이벤트 훅을 SSE로 흘려 같은 화면을 만듭니다. 그래프는
  <code>StrategyGraphTest</code> · <code>ToolsTest</code> · <code>McpTest</code>의 전략 그대로입니다.</p>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const scenarios={
    route:{
      name:'strategy("route")', q:'2 더하기 3은?', svg:'svg-route',
      steps:[
        {act:'r-start', log:['sys','» start']},
        {edge:'r-e1', act:'r-classify', log:['sys','» classify — LLM 판정 중…']},
        {log:['llm','  classify ⇒ "MATH"']},
        {edge:'r-e2', elabel:'r-l2', act:'r-math', log:['sys','» 조건 엣지 매치: "MATH" in text → math']},
        {edge:'r-e4', act:'r-finish', log:['sys','» finish']},
        {log:['ok','← 수학 경로']},
      ],
    },
    tool:{
      name:'strategy("tool-loop")', q:'1엔은 몇 원이야?', svg:'svg-tool',
      steps:[
        {act:'t-start', log:['sys','» start']},
        {edge:'t-e1', act:'t-request', log:['sys','» request — LLM이 도구 호출을 결정']},
        {edge:'t-e2', elabel:'t-l2', act:'t-execute', log:['tool','  ⚙ exchangeRate(code=JPY)']},
        {log:['tool','  ⚙ 도구 결과: 9.2']},
        {edge:'t-e3', act:'t-report', log:['sys','» sendResults — 결과를 LLM에 되돌림']},
        {edge:'t-e4', elabel:'t-l4', act:'t-finish', log:['sys','» finish (onTextMessage)']},
        {log:['ok','← 1엔은 9.2원입니다.']},
      ],
    },
    mcp:{
      name:'McpToolRegistryProvider.streamableHttp', q:'A-1024 주문 어떻게 됐어?', svg:'svg-mcp',
      steps:[
        {act:'m-agent', log:['sys','» streamableHttp 연결: localhost:8080/mcp']},
        {edge:'m-e1', elabel:'m-l1', act:'m-server', log:['tool','  ⚙ tools/list ⇒ lookupOrder · businessHours']},
        {log:['tool','  ⚙ tools/call lookupOrder({"orderId":"A-1024"})']},
        {edge:'m-e2', elabel:'m-l2', act:'m-agent', log:['sys','» 도구 결과를 에이전트가 문장으로']},
        {log:['ok','← A-1024 · 무선 키보드 · 배송중 · 2026-09-02 발송 · 09-05 도착 예정']},
      ],
    },
  };
  const tabs={ 'tab-route':'route', 'tab-tool':'tool', 'tab-mcp':'mcp' };
  let current='route', timer=null, running=false;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resetVisual(key){
    const s=scenarios[key];
    document.querySelectorAll('svg').forEach(v=>v.hidden=(v.id!==s.svg));
    document.querySelectorAll('#'+s.svg+' .node').forEach(n=>n.classList.remove('act','done'));
    document.querySelectorAll('#'+s.svg+' .edge').forEach(e=>{e.classList.remove('taken'); e.setAttribute('marker-end','url(#ar)');});
    document.querySelectorAll('#'+s.svg+' .elabel').forEach(l=>l.classList.remove('taken'));
    $('strategy-name').textContent=s.name;
    $('q-text').textContent=s.q;
    $('out').innerHTML='';
  }
  function applyStep(st){
    if(st.edge){const e=$(st.edge); e.classList.add('taken'); e.setAttribute('marker-end','url(#arT)');}
    if(st.elabel)$(st.elabel).classList.add('taken');
    if(st.act){
      document.querySelectorAll('.node.act').forEach(n=>{n.classList.remove('act'); n.classList.add('done');});
      $(st.act).classList.add('act');
    }
    if(st.log){
      const li=document.createElement('li'); li.className=st.log[0]; li.textContent=st.log[1];
      $('out').appendChild(li);
    }
  }
  function play(key, instant){
    clearTimeout(timer); resetVisual(key);
    const steps=scenarios[key].steps;
    if(instant||reduced){steps.forEach(applyStep); return;}
    running=true; $('run-btn').disabled=true;
    let i=0;
    (function tick(){
      applyStep(steps[i]); i++;
      if(i<steps.length){timer=setTimeout(tick, 650);}
      else{running=false; $('run-btn').disabled=false;}
    })();
  }
  Object.keys(tabs).forEach(id=>{
    $(id).addEventListener('click',()=>{
      Object.keys(tabs).forEach(t=>$(t).setAttribute('aria-selected', String(t===id)));
      current=tabs[id]; clearTimeout(timer); running=false; $('run-btn').disabled=false;
      play(current, true);
    });
  });
  $('run-btn').addEventListener('click',()=>{ if(!running) play(current,false); });
  play('route', true);
})();
</script>
