# API 키가 없다. 모델은 전부 로컬 Ollama 에서 돌린다.
spring.ai.ollama.base-url=http://localhost:11434
# ChatModel 빈의 기본값. Koog 호출은 매번 코드의 LLModel id(KoogModels)로 덮는다.
spring.ai.ollama.chat.model=qwen3:4b-instruct

# 이 이름을 적어 두지 않으면 ChatHistoryProvider 빈이 만들어지지 않는다.
koog.spring.ai.chat-memory.chat-memory-repository-bean-name=chatMemoryRepository

spring.application.name=spring-ai-demo-phase3
# 웹 서버 없음. Spring AI 스타터가 끌어오는 WebFlux 때문에 비워 두면 리액티브 서버를 찾다 실패한다.
spring.main.web-application-type=none
