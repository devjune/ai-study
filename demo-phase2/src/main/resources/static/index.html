<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring AI로 구현하는 에이전틱 패턴</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --line:#000; --dim:#777; --soft:#fafafa; --hi:#ffe; --bar:#000; }
  * { box-sizing:border-box; }
  html { font-size:112.5%; }
  body { margin:0; padding:1.5rem 1.25rem 3rem; color:#000; background:#fff; line-height:1.6;
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:1240px; margin:0 auto; }

  h1 { font-size:1.35rem; border-bottom:2px solid var(--line); padding-bottom:.4rem; margin:0 0 .3rem; }
  .bar { display:flex; align-items:center; gap:.5rem; font-size:.85rem; margin-bottom:1rem; flex-wrap:wrap; }
  select, button { font:inherit; }
  select { font-size:.85rem; padding:.25rem .4rem; border:1px solid var(--line); background:#fff; }
  button { border:1px solid var(--line); background:#fff; cursor:pointer; padding:.3rem .8rem; font-size:.85rem; }
  button.go { background:#000; color:#fff; font-weight:600; }
  button:disabled { opacity:.4; cursor:default; }

  .layout { display:grid; grid-template-columns:230px 1fr; gap:1rem; align-items:start; }
  @media (max-width:920px) { .layout { grid-template-columns:1fr; } }

  /* 왼쪽 패턴 목록 */
  .list { border:1px solid var(--line); max-height:76vh; overflow-y:auto; }
  .list button { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid #eee;
                 padding:.4rem .6rem; font-size:.82rem; background:#fff; }
  .list button:hover { background:var(--soft); }
  .list button[aria-current="true"] { background:#000; color:#fff; font-weight:600; }
  .list .ch { display:inline-block; width:1.6rem; color:var(--dim); font-variant-numeric:tabular-nums; }
  .list button[aria-current="true"] .ch { color:#bbb; }

  /* 오른쪽 상세 */
  .panel { border:1px solid var(--line); }
  .panel > h2 { margin:0; padding:.5rem .7rem; font-size:.9rem; background:var(--soft);
                border-bottom:1px solid var(--line); }
  .panel > .inner { padding:.7rem; }
  /* 패턴의 모양. 문서와 같은 mermaid 원본을 그린다 */
  .shape { margin:0 0 .7rem; overflow-x:auto; }
  .shape:empty { display:none; }
  /* mermaid 는 svg 를 width:100% 로 내놓아 내용이 가운데로 몰린다.
     높이만 묶고 폭은 내용에 맞춰 코드 블록과 같은 왼쪽 기준에 세운다. */
  .shape svg { display:block; margin:0; width:auto; max-width:100%; max-height:20rem; }
  .summary { font-size:.88rem; margin:0 0 .7rem; }
  pre { margin:0 0 .7rem; padding:.6rem; background:var(--soft); border-left:3px solid var(--line);
        font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.72rem; line-height:1.5;
        white-space:pre-wrap; word-break:break-word; overflow-x:auto; }
  /* Kotlin 하이라이팅 — 흑백을 유지하고 굵기와 명도로만 가른다.
     그 장의 주인공(Spring AI 타입·애너테이션·시그니처 메서드)에만 무게를 준다. */
  .kt { color:#333; }
  .kt .k { color:#000; font-weight:600; }
  .kt .t { color:#000; font-weight:600; }
  .kt .m { color:#000; font-weight:600; }
  .kt .s { color:#6a6a6a; }
  .kt .c { color:#9a9a9a; font-style:italic; }
  .kt .n { color:#6a6a6a; }
  .kt .a { color:#000; font-weight:600; background:var(--hi); box-shadow:0 0 0 1px #eee; }

  .run { display:flex; gap:.4rem; }
  /* 터미널 프롬프트 모양. 평소엔 기본값이라 흐릿하게, 잡으면 입력 중이라 또렷하게 */
  .run { position:relative; }
  .run .ps { position:absolute; left:.55rem; top:50%; transform:translateY(-50%);
             color:#aaa; font-size:.85rem; pointer-events:none; }
  .run:focus-within .ps { color:#000; }
  .run input { flex:1; padding:.45rem .45rem .45rem 1.7rem; border:1px solid var(--line);
               font:inherit; font-size:.85rem; box-shadow:inset 0 1px 4px rgba(0,0,0,.10); }
  .run input:hover { border-color:#999; }
  .run input:focus { border-color:#000; box-shadow:none; outline:none; }

  /* 타임라인 */
  .tl { margin-top:.9rem; }
  .tl h3 { font-size:.82rem; margin:0 0 .4rem; padding-bottom:.2rem; border-bottom:1px solid #ddd; }
  .call { display:grid; grid-template-columns:1.6rem 1fr auto; gap:.4rem; align-items:baseline;
          font-size:.8rem; padding:.25rem 0; border-bottom:1px dotted #ddd; }
  .call .n { color:var(--dim); font-variant-numeric:tabular-nums; }
  .call .ms { color:var(--dim); font-size:.72rem; white-space:nowrap; }
  .hint { margin:.1rem 0 .6rem; font-size:.76rem; color:var(--dim); }
  .call details summary { cursor:pointer; }
  .notes { margin:.6rem 0 0; padding:0; list-style:none; font-size:.78rem; color:#333; }
  .notes li { padding:.15rem 0 .15rem .7rem; border-left:2px solid #ddd; margin-bottom:.15rem; }
  .answer { margin-top:.7rem; padding:.6rem; border:1px solid var(--line); white-space:pre-wrap;
            font-size:.85rem; max-height:16rem; overflow-y:auto; }
  .fail { background:#000; color:#fff; }

  /* 주문 (13장) */
  table.orders { width:100%; border-collapse:collapse; font-size:.8rem; margin-top:.7rem; }
  table.orders td { padding:.25rem .2rem; border-bottom:1px solid #eee; }
  .status { font-size:.7rem; border:1px solid var(--line); padding:0 .3rem; }
  .status.cancelled { background:#000; color:#fff; }
  .spin { display:inline-block; width:.75em; height:.75em; border:2px solid var(--line);
          border-right-color:transparent; border-radius:50%; animation:s .7s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>Spring AI로 구현하는 에이전틱 패턴</h1>
  <div class="bar">
    <label for="model">모델</label>
    <select id="model"></select>
  </div>

  <div class="layout">
    <div class="list" id="list"></div>

    <div>
      <div class="panel">
        <h2><span id="title">패턴을 고르세요</span></h2>
        <div class="inner">
          <div class="shape" id="shape"></div>
          <p class="summary" id="summary"></p>
          <pre id="code" class="kt"></pre>
          <div class="run">
            <span class="ps">❯</span><input id="input" placeholder="입력">
            <button class="go" id="go">실행</button>
          </div>

          <div class="tl" id="tl"></div>
        </div>
      </div>

    </div>
  </div>
</main>

<!-- 사내망에서 그대로 띄우므로 라이브러리도 저장소에 담아 둔다 -->
<script src="/vendor/mermaid.min.js"></script>
<script>
mermaid.initialize({ startOnLoad:false, theme:'neutral', securityLevel:'strict' });

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let PATTERNS = [], current = null;

/* ── Kotlin 하이라이팅 ──
   사내망에서 그대로 띄우는 데모라 외부 라이브러리를 쓰지 않는다. 정규식 한 번으로
   왼쪽부터 토큰을 끊어 나가므로, 주석이나 문자열 안의 낱말이 키워드로 잡히지 않는다. */
const KEYWORD = /^(package|import|class|interface|object|data|enum|fun|val|var|override|return|if|else|for|while|when|is|in|as|by|private|public|internal|companion|const|suspend|this|it|true|false|null|implementation)$/;
/* 패턴의 주인공이 되는 Spring AI 메서드. 타입·애너테이션과 같은 무게로 띄운다. */
const METHOD = /^(entity|tools|advisors|system|defaultSystem|defaultAdvisors|getOrder|evaluate|options|searchRequest|similarityThreshold|topK|disableThinking)$/;
const TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|^[ \t]*#[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*")|(@\w+)|\b(\d+(?:\.\d+)?f?)\b|\b([A-Za-z_]\w*)\b/gm;

function highlight(code) {
  let out = '', last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(code)) !== null) {
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'a' : m[4] ? 'n'
      : KEYWORD.test(m[5]) ? 'k' : METHOD.test(m[5]) ? 'm'
      : /^[A-Z]/.test(m[5]) ? 't' : '';
    out += esc(code.slice(last, m.index))
      + (cls ? `<span class="${cls}">${esc(m[0])}</span>` : esc(m[0]));
    last = m.index + m[0].length;
  }
  return out + esc(code.slice(last));
}

/* ── 목록 ── */
function renderList() {
  $('list').innerHTML = PATTERNS.map(p => `
    <button data-ch="${p.chapter}" aria-current="${current?.chapter === p.chapter}">
      <span class="ch">${p.chapter}</span>${p.name}
    </button>`).join('');
  $('list').querySelectorAll('button').forEach(b =>
    b.onclick = () => select(PATTERNS.find(p => p.chapter === +b.dataset.ch)));
}

function select(p) {
  current = p;
  $('title').textContent = `${p.chapter}장 ${p.name} (${p.english})`;
  drawShape(p);
  $('summary').textContent = p.summary;
  $('code').innerHTML = highlight(p.code);
  $('input').value = p.defaultInput;
  if ([...$('model').options].some(o => o.value === p.model)) $('model').value = p.model;
  $('tl').innerHTML = '';
  renderList();
}

/* 그림은 장마다 다시 그린다. id 가 겹치면 mermaid 가 캐시를 물고 오므로 매번 새로 준다 */
let shapeSeq = 0;
async function drawShape(p) {
  const box = $('shape');
  if (!p.diagram) { box.innerHTML = ''; return; }
  const { svg } = await mermaid.render(`shape-${++shapeSeq}`, p.diagram);
  box.innerHTML = svg;
  box.querySelector('svg')?.setAttribute('preserveAspectRatio', 'xMinYMid meet');
}

/* ── 실행 ── */
async function run() {
  if (!current) return;
  $('go').disabled = true;
  $('tl').innerHTML = '<h3><span class="spin"></span> 실행 중…</h3>';
  try {
    const r = await (await fetch(`/api/patterns/${current.chapter}/run`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ input: $('input').value, model: $('model').value })
    })).json();
    renderResult(r);
    if (current.chapter === 13) loadOrders(null, r.pendingCancel);
  } catch (e) {
    $('tl').innerHTML = `<h3>요청 실패</h3><div class="answer fail">${esc(e.message)}</div>`;
  } finally { $('go').disabled = false; }
}

function renderResult(r) {
  const n = r.calls.length;
  let h = `<h3>모델 호출 <b>${n}회</b> · ${(r.elapsedMs/1000).toFixed(1)}초${n === 0 ? ' — 이 앱에서는 모델을 부르지 않았습니다' : ''}</h3>`;
  if (n) h += `<p class="hint">펼치면 그 호출에 <b>실제로 나간 프롬프트</b>가 보입니다. 프레임워크가 얹어 준 것도 여기서 확인합니다.</p>`;
  h += r.calls.map(c => `
    <div class="call">
      <span class="n">${c.seq}</span>
      <details><summary>${esc(c.step)}</summary><pre>${esc(c.prompt)}</pre></details>
      <span class="ms">${c.elapsedMs ? c.elapsedMs + 'ms' + (c.sameCall ? ' · 왕복 합계' : '')
                                       : (c.sameCall ? '같은 .call() 안' : '')}</span>
    </div>`).join('');
  if (r.notes?.length)
    h += `<ul class="notes">` + r.notes.map(x => `<li>${esc(x)}</li>`).join('') + `</ul>`;
  h += `<div class="answer ${r.ok ? '' : 'fail'}">${esc(r.output)}</div>`;
  if (current.chapter === 13) h += `<div id="orders"></div>`;
  $('tl').innerHTML = h;
}

/* ── 주문 (13장 승인) ── */
/* pendingId 는 모델이 취소를 요청한 주문. 화면이 스스로 고르면 아무도 요청하지 않은
   주문을 승인하게 되므로, 서버가 돌려준 값이 있을 때만 버튼을 단다. */
async function loadOrders(list, pendingId) {
  const box = $('orders'); if (!box) return;
  const orders = list || await (await fetch('/api/orders')).json();
  box.innerHTML = `<table class="orders"><tbody>` + orders.map(o => `
      <tr><td>${o.id}</td><td>${o.product}</td>
      <td><span class="status ${o.status === '취소됨' ? 'cancelled' : ''}">${o.status}</span></td></tr>`).join('')
    + `</tbody></table>`
    + (pendingId ? `<button id="approve" class="go" style="margin-top:.5rem">승인 — ${esc(pendingId)} 취소 (LLM 없이 실행)</button>` : '');
  const btn = $('approve');
  if (btn) btn.onclick = async () => {
    const r = await (await fetch('/api/approve', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ orderId: pendingId })
    })).json();
    loadOrders(r.orders);
  };
}

$('go').onclick = run;
$('input').onkeydown = e => { if (e.key === 'Enter') run(); };

(async () => {
  const models = await (await fetch('/api/models')).json();
  $('model').innerHTML = models.map(m => `<option>${m}</option>`).join('');
  PATTERNS = await (await fetch('/api/patterns')).json();
  renderList();
  select(PATTERNS[0]);
})();
</script>
</body>
</html>
