# API 키가 없다. 모델은 전부 로컬 Ollama 에서 돌린다.
spring.ai.ollama.base-url=http://localhost:11434

# 기본 채팅 모델. 화면에서 모델을 고르면 요청마다 이 값을 덮어쓴다
# (ChatOptions.builder().model(...) — 재시작 없이 전환된다).
#
# qwen3 계열의 `-instruct` 는 thinking 을 끈 하이브리드가 아니라 **비-thinking 전용**
# 으로 훈련된 모델이다. 하이브리드에서 thinking 만 끄면 빨라지는 대신 구조화 출력이
# 깨지는데(study-log 참고), instruct 모델은 둘 다 얻는다.
spring.ai.ollama.chat.model=qwen3:4b-instruct

# 화면에 띄울 모델. 미리 `ollama pull` 로 받아 두어야 한다.
#
# 빠른 순(작은 순)으로 늘어놓는다. 장을 고르면 그 장에 맞는 모델이 자동으로
# 선택되므로(PatternSpec.model), 이 순서는 직접 바꿔 볼 때의 편의를 위한 것이다.
#
#   qwen3:0.6b        가장 빠르지만 thinking 에 토큰을 다 쓴다. 답이 비거나 JSON 이 깨진다
#   qwen3:1.7b        16장이 `작은 모델` 로 쓰는 쪽
#   granite4:micro    8·12·18·19장은 이쪽이 더 빠르면서 결과가 같다
#   qwen3:4b-instruct 기본. non-thinking 이라 구조화 출력과 도구 호출이 안정적이다
#   glm4:9b           도구를 부르지 않는 대조군
demo.models=qwen3:0.6b,qwen3:1.7b,granite4:micro,qwen3:4b-instruct,glm4:9b

# 온도를 낮게 고정한다. 모델 간 비교가 목적이라 실행마다 답이 흔들리면
# 무엇이 모델 차이고 무엇이 샘플링 노이즈인지 구분할 수 없다.
spring.ai.ollama.chat.temperature=0.1

# RAG 시험 축이 쓰는 임베딩. 채팅과 같은 Ollama 채널이라
# 별도 다운로드 경로(ONNX)를 타지 않는다 — 사내망에서 중요하다.
spring.ai.ollama.embedding.model=bge-m3

# 모델이 없으면 기동 시 받아온다. 사내망처럼 레지스트리가 막힌 곳에서는
# never 로 두고 미리 반입한다(docs/phase2/offline-kit.md).
spring.ai.ollama.init.pull-model-strategy=never

# 재시도를 끈다. 기본값은 10회에 2초→10초→50초 백오프라, Ollama 가 떠 있지
# 않거나 모델이 없으면 화면이 몇 분씩 멈춘다. 비교 대상은 "첫 시도에 이 모델이
# 무엇을 했나"이므로 재시도는 관측을 흐리기만 한다.
spring.ai.retry.max-attempts=1

server.port=8080
spring.application.name=spring-ai-local-llm-demo

# 프롬프트 전문과 응답 원문을 INFO 로 찍는다. RAG 가 끼워넣은 문서와
# 도구 호출 왕복이 그대로 보인다. 민감정보가 남으므로 운영에서는 끈다.
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true

# 토큰 사용량 지표 — /actuator/metrics/gen_ai.client.token.usage
management.endpoints.web.exposure.include=health,metrics

# 10·15장 — 앱 자체를 MCP 서버로 띄운다. @McpTool 이 붙은 함수가 프로토콜로 노출된다
spring.ai.mcp.server.name=spring-ai-pattern-demo
spring.ai.mcp.server.protocol=STATELESS
