# API 키가 없다. 모델은 전부 로컬 Ollama 에서 돌린다.
spring.ai.ollama.base-url=http://localhost:11434

# 기본 채팅 모델. 화면에서 모델을 고르면 요청마다 이 값을 덮어쓴다
# (ChatOptions.builder().model(...) — 재시작 없이 전환된다).
spring.ai.ollama.chat.options.model=qwen3:8b

# 온도를 낮게 고정한다. 모델 간 비교가 목적이라 실행마다 답이 흔들리면
# 무엇이 모델 차이고 무엇이 샘플링 노이즈인지 구분할 수 없다.
spring.ai.ollama.chat.options.temperature=0.1

# RAG 시험 축이 쓰는 임베딩. 채팅과 같은 Ollama 채널이라
# 별도 다운로드 경로(ONNX)를 타지 않는다 — 사내망에서 중요하다.
spring.ai.ollama.embedding.options.model=nomic-embed-text

# 모델이 없으면 기동 시 받아온다. 사내망처럼 레지스트리가 막힌 곳에서는
# never 로 두고 미리 반입한다(docs/phase2/offline-kit.md).
spring.ai.ollama.init.pull-model-strategy=never

# 재시도를 끈다. 기본값은 10회에 2초→10초→50초 백오프라, Ollama 가 떠 있지
# 않거나 모델이 없으면 화면이 몇 분씩 멈춘다. 비교 대상은 "첫 시도에 이 모델이
# 무엇을 했나"이므로 재시도는 관측을 흐리기만 한다.
spring.ai.retry.max-attempts=1

server.port=8080
spring.application.name=spring-ai-local-llm-demo

# 프롬프트 전문과 응답 원문을 INFO 로 찍는다. RAG 가 끼워넣은 문서와
# 도구 호출 왕복이 그대로 보인다. 민감정보가 남으므로 운영에서는 끈다.
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true

# 토큰 사용량 지표 — /actuator/metrics/gen_ai.client.token.usage
management.endpoints.web.exposure.include=health,metrics
